<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radar de Amor & Proximidade</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Estilização customizada para o mapa Leaflet em Dark Mode */
        .leaflet-tile {
            filter: brightness(0.8) invert(1) contrast(1.2) hue-rotate(200deg) saturate(0.3);
        }
        .leaflet-container {
            background-color: #0f172a !important;
        }
        .leaflet-control-zoom {
            border: none !important;
            margin-right: 12px !important;
            margin-bottom: 80px !important;
        }
        .leaflet-control-zoom a {
            background-color: rgba(30, 41, 59, 0.9) !important;
            color: #f8fafc !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            backdrop-filter: blur(8px);
            border-radius: 12px !important;
            margin-bottom: 4px;
        }

        /* Animações customizadas */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 0.2; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        @keyframes float-heart {
            0% { transform: translateY(0) scale(0.8); opacity: 1; }
            50% { transform: translateY(-100px) scale(1.3); opacity: 0.8; }
            100% { transform: translateY(-200px) scale(0.5); opacity: 0; }
        }

        .pulse-marker {
            position: relative;
        }
        .pulse-marker::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: inherit;
            animation: pulse-ring 2s infinite ease-in-out;
            z-index: -1;
        }

        .floating-heart-anim {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            animation: float-heart 2.5s ease-out forwards;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-screen overflow-hidden flex flex-col justify-between">

    <!-- Overlay de Animação de Amor/Atenção -->
    <div id="fx-overlay" class="fixed inset-0 pointer-events-none z-50 flex items-center justify-center overflow-hidden"></div>

    <!-- TELA DE LOGIN / CRIAR SALA -->
    <div id="room-modal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-md shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-rose-500 to-indigo-600 text-white text-2xl shadow-lg shadow-rose-500/20 mb-2">
                    <i class="fa-solid me-0 fa-heart-pulse"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-white">Conexão em Tempo Real</h1>
                <p class="text-xs text-slate-400">Conecte com seu parceiro(a), acompanhe a localização e receba alertas de proximidade.</p>
            </div>

            <!-- Formulário de Nome e Sala -->
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Seu Nome / Apelido</label>
                    <input type="text" id="user-name" placeholder="Ex: Amor, João, Maria" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-rose-500 transition-colors">
                </div>

                <div class="grid grid-cols-2 gap-3 pt-2">
                    <button onclick="createRoom()" class="bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-500 hover:to-pink-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-rose-900/30 transition-all flex items-center justify-center gap-2 text-sm">
                        <i class="fa-solid fa-plus"></i> Criar Sala
                    </button>
                    <button onclick="toggleJoinInput()" class="bg-slate-800 hover:bg-slate-700 text-white font-semibold py-3 px-4 rounded-xl border border-slate-700 transition-all flex items-center justify-center gap-2 text-sm">
                        <i class="fa-solid fa-right-to-bracket"></i> Entrar
                    </button>
                </div>

                <!-- Input para Entrar em Sala Existente -->
                <div id="join-container" class="hidden space-y-3 pt-2 border-t border-slate-800/80">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Código da Sala (6 dígitos)</label>
                    <div class="flex gap-2">
                        <input type="text" id="room-code-input" maxlength="6" placeholder="123456" class="w-full uppercase tracking-widest text-center font-mono text-lg bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-slate-100 focus:outline-none focus:border-rose-500">
                        <button onclick="joinRoom()" class="bg-rose-600 hover:bg-rose-500 text-white font-semibold px-5 rounded-xl transition-colors">
                            OK
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- CABEÇALHO DA APLICAÇÃO -->
    <header class="absolute top-0 left-0 right-0 z-40 p-4 pointer-events-none flex justify-between items-start">
        <!-- Status do Parceiro / Conexão -->
        <div class="pointer-events-auto bg-slate-900/90 border border-slate-800/80 backdrop-blur-md rounded-2xl p-3 shadow-xl flex items-center gap-3 min-w-[200px]">
            <div class="relative">
                <div id="partner-avatar" class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-rose-400 font-bold text-lg">
                    ?
                </div>
                <span id="partner-online-dot" class="absolute -bottom-1 -right-1 w-3.5 h-3.5 bg-slate-500 border-2 border-slate-900 rounded-full"></span>
            </div>
            <div class="flex-1 min-w-0">
                <div id="partner-name" class="font-semibold text-sm truncate text-slate-200">Aguardando Conexão...</div>
                <div class="flex items-center gap-2 text-xs text-slate-400 mt-0.5">
                    <span id="partner-dist" class="text-rose-400 font-mono font-medium">-- m</span>
                    <span>•</span>
                    <span id="partner-battery" class="flex items-center gap-1">
                        <i class="fa-solid fa-battery-half"></i> --%
                    </span>
                </div>
            </div>
        </div>

        <!-- Informações da Sala & Configurações de Som -->
        <div class="pointer-events-auto flex flex-col items-end gap-2">
            <div class="bg-slate-900/90 border border-slate-800/80 backdrop-blur-md rounded-xl px-3 py-1.5 shadow-xl flex items-center gap-2">
                <span class="text-xs text-slate-400 uppercase tracking-wider">Sala:</span>
                <span id="current-room-display" class="font-mono text-xs font-bold text-rose-400">------</span>
                <button onclick="copyRoomCode()" class="text-slate-400 hover:text-white text-xs ml-1 active:scale-95 transition-transform" title="Copiar código">
                    <i class="fa-regular fa-copy"></i>
                </button>
            </div>

            <!-- Botão do Sinalizador de Proximidade -->
            <button id="proximity-toggle-btn" onclick="toggleProximityAlarm()" class="bg-slate-900/90 border border-slate-800/80 text-slate-400 backdrop-blur-md px-3 py-2 rounded-xl text-xs font-medium flex items-center gap-2 shadow-xl hover:text-white transition-colors">
                <i id="proximity-icon" class="fa-solid fa-bell-slash text-slate-500"></i>
                <span id="proximity-text">Alarme Off</span>
            </button>
        </div>
    </header>

    <!-- MAPA LEAFLET -->
    <div id="map" class="w-full h-full z-10"></div>

    <!-- PAINEL INFERIOR DE CONTROLES E AÇÕES -->
    <footer class="absolute bottom-0 left-0 right-0 z-40 p-4 pointer-events-none flex flex-col gap-3">

        <!-- Barra de Configurações Rápidas (Limite de Alarme + Botão Centralizar) -->
        <div class="pointer-events-auto flex justify-between items-center px-1">
            <div class="bg-slate-900/90 border border-slate-800/80 backdrop-blur-md px-3 py-1.5 rounded-xl text-xs text-slate-300 flex items-center gap-2 shadow-lg">
                <i class="fa-solid fa-radar text-rose-500"></i>
                <span>Alerta:</span>
                <select id="proximity-limit" onchange="updateProximityLimit()" class="bg-slate-950 border border-slate-800 rounded px-1.5 py-0.5 text-xs text-rose-400 font-mono focus:outline-none">
                    <option value="10">10m</option>
                    <option value="20" selected>20m</option>
                    <option value="50">50m</option>
                    <option value="100">100m</option>
                    <option value="500">500m</option>
                </select>
            </div>

            <button onclick="centerMapOnBoth()" class="bg-slate-900/90 border border-slate-800/80 text-slate-200 backdrop-blur-md w-10 h-10 rounded-xl shadow-lg flex items-center justify-center hover:bg-slate-800 active:scale-95 transition-all">
                <i class="fa-solid fa-location-crosshairs text-rose-400"></i>
            </button>
        </div>

        <!-- Botões de Interação Rápida -->
        <div class="pointer-events-auto bg-slate-900/95 border border-slate-800/90 backdrop-blur-xl rounded-2xl p-3 shadow-2xl grid grid-cols-4 gap-2">
            <!-- Mandar Amor -->
            <button onclick="sendAction('love')" class="flex flex-col items-center justify-center py-2 px-1 rounded-xl bg-gradient-to-b from-rose-500/10 to-pink-500/10 border border-rose-500/20 text-rose-400 hover:bg-rose-500/20 active:scale-95 transition-all">
                <i class="fa-solid fa-heart text-xl mb-1 text-rose-500"></i>
                <span class="text-[10px] font-semibold">Mandar Amor</span>
            </button>

            <!-- Chamar Atenção -->
            <button onclick="sendAction('attention')" class="flex flex-col items-center justify-center py-2 px-1 rounded-xl bg-gradient-to-b from-amber-500/10 to-orange-500/10 border border-amber-500/20 text-amber-400 hover:bg-amber-500/20 active:scale-95 transition-all">
                <i class="fa-solid fa-bell text-xl mb-1 text-amber-500"></i>
                <span class="text-[10px] font-semibold">Chamar Atenção</span>
            </button>

            <!-- Buzina -->
            <button onclick="sendAction('honk')" class="flex flex-col items-center justify-center py-2 px-1 rounded-xl bg-gradient-to-b from-indigo-500/10 to-blue-500/10 border border-indigo-500/20 text-indigo-400 hover:bg-indigo-500/20 active:scale-95 transition-all">
                <i class="fa-solid fa-bullhorn text-xl mb-1 text-indigo-400"></i>
                <span class="text-[10px] font-semibold">Buzinar</span>
            </button>

            <!-- Chat -->
            <button onclick="toggleChat()" class="flex flex-col items-center justify-center py-2 px-1 rounded-xl bg-gradient-to-b from-slate-800/50 to-slate-800/30 border border-slate-700/50 text-slate-300 hover:bg-slate-800 active:scale-95 transition-all relative">
                <i class="fa-solid fa-comments text-xl mb-1 text-slate-400"></i>
                <span class="text-[10px] font-semibold">Mensagem</span>
                <span id="chat-unread-dot" class="hidden absolute top-1 right-2 w-2.5 h-2.5 bg-rose-500 rounded-full"></span>
            </button>
        </div>
    </footer>

    <!-- MODAL DE CHAT RÁPIDO -->
    <div id="chat-modal" class="fixed inset-x-0 bottom-0 z-50 bg-slate-900/95 border-t border-slate-800 backdrop-blur-2xl rounded-t-3xl p-4 shadow-2xl transition-transform duration-300 translate-y-full max-h-[70vh] flex flex-col">
        <div class="flex justify-between items-center pb-3 border-b border-slate-800 mb-3">
            <h3 class="font-bold text-sm text-slate-200 flex items-center gap-2">
                <i class="fa-solid fa-comments text-rose-500"></i> Chat do Casal
            </h3>
            <button onclick="toggleChat()" class="text-slate-400 hover:text-white p-1">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <!-- Lista de Mensagens -->
        <div id="chat-messages" class="flex-1 overflow-y-auto space-y-2 mb-3 min-h-[180px] max-h-[300px] pr-1">
            <div class="text-center text-xs text-slate-500 py-4">Nenhuma mensagem ainda. Digite algo fofo!</div>
        </div>

        <!-- Input de Mensagem -->
        <div class="flex gap-2 pt-2 border-t border-slate-800">
            <input type="text" id="chat-input" placeholder="Digite uma mensagem..." onkeydown="if(event.key==='Enter') sendChatMessage()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm text-slate-100 focus:outline-none focus:border-rose-500">
            <button onclick="sendChatMessage()" class="bg-rose-600 hover:bg-rose-500 text-white font-semibold px-4 rounded-xl transition-colors">
                <i class="fa-solid fa-paper-plane text-xs"></i>
            </button>
        </div>
    </div>

    <!-- CAIXA DE MENSAGEM / MODAL ALERTA CUSTOMIZADO (SUBSTITUI ALERT) -->
    <div id="custom-alert" class="hidden fixed top-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 border border-slate-700 text-slate-100 px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 backdrop-blur-md border-l-4 border-l-rose-500">
        <i id="custom-alert-icon" class="fa-solid fa-circle-info text-rose-500 text-lg"></i>
        <span id="custom-alert-msg" class="text-sm font-medium"></span>
    </div>

    <!-- FIREBASE SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, serverTimestamp, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyD3Q2P6lch9XxxYlJoEsdqqwwt3KBJgpFc",
            authDomain: "projeto-a08cb.firebaseapp.com",
            databaseURL: "https://projeto-a08cb-default-rtdb.firebaseio.com",
            projectId: "projeto-a08cb",
            storageBucket: "projeto-a08cb.firebasestorage.app",
            messagingSenderId: "996658403778",
            appId: "1:996658403778:web:ff1366788e1ccae69a5e5b",
            measurementId: "G-Y8EF78SCK8"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Variáveis de Estado
        let myUserId = 'user_' + Math.random().toString(36).substr(2, 9);
        let currentRoomCode = null;
        let myName = "Eu";
        let partnerData = null;
        let myPosition = null;
        let watchId = null;
        let map = null;
        let myMarker = null;
        let partnerMarker = null;
        let distanceLine = null;
        let isProximityAlarmEnabled = false;
        let proximityLimitMeters = 20;
        let audioCtx = null;
        let isBeeping = false;
        let beepInterval = null;

        // --- WEB AUDIO API (Sinalizadores Sonoros) ---
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Tocar som de bipe simples
        function playBeep(freq = 880, duration = 150, type = 'sine') {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration/1000);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration/1000);
            } catch(e) { console.error(e); }
        }

        // Som de Amor / Mimo (Efeito fofo)
        function playLoveSound() {
            initAudio();
            const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
            notes.forEach((freq, idx) => {
                setTimeout(() => playBeep(freq, 180, 'sine'), idx * 120);
            });
        }

        // Som de Chamar Atenção / Alarme
        function playAttentionSound() {
            initAudio();
            for (let i = 0; i < 4; i++) {
                setTimeout(() => {
                    playBeep(1200, 100, 'sawtooth');
                    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                }, i * 200);
            }
        }

        // Som de Buzina
        function playHonkSound() {
            initAudio();
            playBeep(350, 300, 'triangle');
            setTimeout(() => playBeep(350, 400, 'triangle'), 350);
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        }

        // Controle do Alarme Continuo de Proximidade
        function startProximityBeep() {
            if (isBeeping) return;
            isBeeping = true;
            beepInterval = setInterval(() => {
                playBeep(1000, 100, 'sine');
                if (navigator.vibrate) navigator.vibrate(80);
            }, 800);
        }

        function stopProximityBeep() {
            if (!isBeeping) return;
            isBeeping = false;
            clearInterval(beepInterval);
        }

        // --- MAPA LEAFLET ---
        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([0, 0], 2);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);

            // Re-posiciona controles de zoom
            L.control.zoom({ position: 'bottomright' }).addTo(map);
        }

        // Criar Ícone Customizado
        function createCustomIcon(isMe, name) {
            const initial = (name || '?').charAt(0).toUpperCase();
            const colorClass = isMe ? 'bg-indigo-600 border-indigo-400' : 'bg-rose-600 border-rose-400';
            
            const html = `
                <div class="relative flex flex-col items-center">
                    <div class="w-10 h-10 rounded-2xl ${colorClass} border-2 text-white font-bold text-sm flex items-center justify-center shadow-2xl pulse-marker">
                        ${initial}
                    </div>
                    <div class="bg-slate-900/90 border border-slate-800 text-[10px] text-slate-200 font-semibold px-2 py-0.5 rounded-full mt-1 shadow-md whitespace-nowrap">
                        ${isMe ? 'Você' : name}
                    </div>
                </div>
            `;
            return L.divIcon({
                html: html,
                className: 'custom-leaflet-marker',
                iconSize: [40, 50],
                iconAnchor: [20, 25]
            });
        }

        // --- GEOLOCALIZAÇÃO ---
        function startLocationTracking() {
            if (!navigator.geolocation) {
                showAlert('Geolocalização não é suportada no seu navegador.');
                return;
            }

            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    const accuracy = Math.round(pos.coords.accuracy);

                    myPosition = { lat, lng };

                    // Atualiza no Mapa local
                    updateMyMarker(lat, lng);

                    // Atualiza no Firebase
                    if (currentRoomCode) {
                        getBatteryLevel().then(battery => {
                            set(ref(db, `rooms/${currentRoomCode}/users/${myUserId}`), {
                                name: myName,
                                lat: lat,
                                lng: lng,
                                accuracy: accuracy,
                                battery: battery,
                                lastSeen: serverTimestamp()
                            });
                        });
                    }

                    // Calcular distância se o parceiro existir
                    checkDistanceAndAlert();
                },
                (err) => {
                    console.warn('Erro GPS:', err);
                    showAlert('Ative o GPS para compartilhar a localização.');
                },
                {
                    enableHighAccuracy: true,
                    maximumAge: 5000,
                    timeout: 10000
                }
            );
        }

        // Bateria do Dispositivo
        async function getBatteryLevel() {
            if ('getBattery' in navigator) {
                try {
                    const batt = await navigator.getBattery();
                    return Math.round(batt.level * 100);
                } catch(e) { return 100; }
            }
            return 100;
        }

        // Atualizar marcador local
        function updateMyMarker(lat, lng) {
            if (!map) return;
            if (!myMarker) {
                myMarker = L.marker([lat, lng], { icon: createCustomIcon(true, myName) }).addTo(map);
                map.setView([lat, lng], 16);
            } else {
                myMarker.setLatLng([lat, lng]);
            }
        }

        // --- CÁLCULO DE DISTÂNCIA (Fórmula de Haversine) ---
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Metros
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;

            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

            return R * c; // Distância em metros
        }

        function checkDistanceAndAlert() {
            if (!myPosition || !partnerData || !partnerData.lat || !partnerData.lng) return;

            const dist = calculateDistance(myPosition.lat, myPosition.lng, partnerData.lat, partnerData.lng);
            
            // Formatador de distância
            const distDisplay = dist > 1000 ? `${(dist/1000).toFixed(1)} km` : `${Math.round(dist)} m`;
            document.getElementById('partner-dist').innerText = distDisplay;

            // Atualiza linha conectando os dois no mapa
            if (distanceLine) map.removeLayer(distanceLine);
            distanceLine = L.polyline([
                [myPosition.lat, myPosition.lng],
                [partnerData.lat, partnerData.lng]
            ], {
                color: '#f43f5e',
                weight: 3,
                dashArray: '8, 8',
                opacity: 0.6
            }).addTo(map);

            // Alarme de Proximidade
            if (isProximityAlarmEnabled && dist <= proximityLimitMeters) {
                startProximityBeep();
            } else {
                stopProximityBeep();
            }
        }

        // --- GERENCIAMENTO DE SALAS NO FIREBASE ---
        window.createRoom = function() {
            initAudio();
            const nameInput = document.getElementById('user-name').value.trim();
            if (!nameInput) {
                showAlert('Por favor, digite seu nome primeiro.');
                return;
            }
            myName = nameInput;

            // Gera código aleatório de 6 dígitos
            const code = Math.floor(100000 + Math.random() * 900000).toString();
            currentRoomCode = code;

            setupRoomListeners();
            document.getElementById('room-modal').classList.add('hidden');
            document.getElementById('current-room-display').innerText = code;
            showAlert(`Sala criada! Código: ${code}`);

            startLocationTracking();
        };

        window.toggleJoinInput = function() {
            const container = document.getElementById('join-container');
            container.classList.toggle('hidden');
        };

        window.joinRoom = function() {
            initAudio();
            const nameInput = document.getElementById('user-name').value.trim();
            const roomCode = document.getElementById('room-code-input').value.trim();

            if (!nameInput) {
                showAlert('Por favor, digite seu nome.');
                return;
            }
            if (!roomCode || roomCode.length !== 6) {
                showAlert('Digite um código de 6 dígitos válido.');
                return;
            }

            myName = nameInput;
            currentRoomCode = roomCode;

            setupRoomListeners();
            document.getElementById('room-modal').classList.add('hidden');
            document.getElementById('current-room-display').innerText = roomCode;
            showAlert(`Entrou na sala: ${roomCode}`);

            startLocationTracking();
        };

        function setupRoomListeners() {
            const roomUsersRef = ref(db, `rooms/${currentRoomCode}/users`);
            const roomActionsRef = ref(db, `rooms/${currentRoomCode}/actions`);
            const roomChatRef = ref(db, `rooms/${currentRoomCode}/chat`);

            // Configurar OnDisconnect para limpar ou avisar quando sair
            const myUserRef = ref(db, `rooms/${currentRoomCode}/users/${myUserId}`);
            onDisconnect(myUserRef).remove();

            // Escutar Usuários da Sala
            onValue(roomUsersRef, (snapshot) => {
                const users = snapshot.val() || {};
                let foundPartner = false;

                Object.keys(users).forEach(uid => {
                    if (uid !== myUserId) {
                        foundPartner = true;
                        partnerData = users[uid];
                        updatePartnerUI();
                    }
                });

                if (!foundPartner) {
                    partnerData = null;
                    document.getElementById('partner-name').innerText = 'Aguardando Parceiro(a)...';
                    document.getElementById('partner-dist').innerText = '-- m';
                    document.getElementById('partner-battery').innerHTML = '<i class="fa-solid fa-battery-half"></i> --%';
                    document.getElementById('partner-avatar').innerText = '?';
                    document.getElementById('partner-online-dot').className = "absolute -bottom-1 -right-1 w-3.5 h-3.5 bg-slate-500 border-2 border-slate-900 rounded-full";
                    if (partnerMarker) map.removeLayer(partnerMarker);
                    if (distanceLine) map.removeLayer(distanceLine);
                }
            });

            // Escutar Ações (Amor, Atenção, Buzina)
            onValue(roomActionsRef, (snapshot) => {
                const action = snapshot.val();
                if (action && action.target === myUserId && action.timestamp > (Date.now() - 4000)) {
                    triggerActionEffect(action.type, action.senderName);
                }
            });

            // Escutar Chat
            onValue(roomChatRef, (snapshot) => {
                const messages = snapshot.val() || {};
                renderChatMessages(messages);
            });
        }

        // Atualizar Informações do Parceiro na Tela
        function updatePartnerUI() {
            if (!partnerData) return;

            document.getElementById('partner-name').innerText = partnerData.name || 'Parceiro(a)';
            document.getElementById('partner-avatar').innerText = (partnerData.name || 'P').charAt(0).toUpperCase();
            document.getElementById('partner-battery').innerHTML = `<i class="fa-solid fa-battery-full text-emerald-400"></i> ${partnerData.battery || '--'}%`;
            document.getElementById('partner-online-dot').className = "absolute -bottom-1 -right-1 w-3.5 h-3.5 bg-emerald-500 border-2 border-slate-900 rounded-full";

            // Marcador no Mapa
            if (partnerData.lat && partnerData.lng) {
                if (!partnerMarker) {
                    partnerMarker = L.marker([partnerData.lat, partnerData.lng], {
                        icon: createCustomIcon(false, partnerData.name)
                    }).addTo(map);
                } else {
                    partnerMarker.setLatLng([partnerData.lat, partnerData.lng]);
                }
            }

            checkDistanceAndAlert();
        }

        // --- AÇÕES & INTERAÇÕES ---
        window.sendAction = function(type) {
            initAudio();
            if (!currentRoomCode || !partnerData) {
                showAlert('Nenhum parceiro conectado na sala.');
                return;
            }

            set(ref(db, `rooms/${currentRoomCode}/actions`), {
                type: type,
                senderName: myName,
                timestamp: Date.now(),
                target: 'partner' // Funciona para o outro receptor na sala
            });

            showAlert(`Enviado!`);
        };

        // Disparar Efeito no Dispositivo Receptor
        function triggerActionEffect(type, senderName) {
            const overlay = document.getElementById('fx-overlay');

            if (type === 'love') {
                playLoveSound();
                showAlert(`${senderName} te enviou muito Amor! ❤️`);
                
                // Animação de Corações Flutuantes
                for (let i = 0; i < 15; i++) {
                    setTimeout(() => {
                        const heart = document.createElement('div');
                        heart.className = 'floating-heart-anim text-4xl text-rose-500';
                        heart.innerHTML = '❤️';
                        heart.style.left = (Math.random() * 80 + 10) + 'vw';
                        heart.style.top = '80vh';
                        overlay.appendChild(heart);
                        setTimeout(() => heart.remove(), 2500);
                    }, i * 150);
                }
            } 
            else if (type === 'attention') {
                playAttentionSound();
                showAlert(`🚨 ${senderName} está chamando sua Atenção!`);
                
                // Piscar Tela em Vermelho
                const flash = document.createElement('div');
                flash.className = 'absolute inset-0 bg-rose-500/30 animate-pulse pointer-events-none z-50';
                overlay.appendChild(flash);
                setTimeout(() => flash.remove(), 2000);
            } 
            else if (type === 'honk') {
                playHonkSound();
                showAlert(`📢 ${senderName} buzinou para você!`);
            }
        }

        // --- ALARME DE PROXIMIDADE ---
        window.toggleProximityAlarm = function() {
            initAudio();
            isProximityAlarmEnabled = !isProximityAlarmEnabled;
            const btn = document.getElementById('proximity-toggle-btn');
            const icon = document.getElementById('proximity-icon');
            const text = document.getElementById('proximity-text');

            if (isProximityAlarmEnabled) {
                btn.classList.remove('text-slate-400');
                btn.classList.add('text-rose-400', 'border-rose-500/50');
                icon.className = 'fa-solid fa-bell text-rose-500 animate-bounce';
                text.innerText = 'Alarme On';
                showAlert('Alerta de Proximidade Ativado!');
            } else {
                btn.classList.remove('text-rose-400', 'border-rose-500/50');
                btn.classList.add('text-slate-400');
                icon.className = 'fa-solid fa-bell-slash text-slate-500';
                text.innerText = 'Alarme Off';
                stopProximityBeep();
                showAlert('Alerta Desativado');
            }
        };

        window.updateProximityLimit = function() {
            proximityLimitMeters = parseInt(document.getElementById('proximity-limit').value);
            showAlert(`Limite de proximidade: ${proximityLimitMeters}m`);
            checkDistanceAndAlert();
        };

        // Centralizar Mapa nos Dois Marcadores
        window.centerMapOnBoth = function() {
            if (myMarker && partnerMarker) {
                const group = new L.featureGroup([myMarker, partnerMarker]);
                map.fitBounds(group.getBounds().pad(0.3));
            } else if (myMarker) {
                map.setView(myMarker.getLatLng(), 16);
            }
        };

        // Copiar Código da Sala
        window.copyRoomCode = function() {
            if (!currentRoomCode) return;
            const tempInput = document.createElement('input');
            tempInput.value = currentRoomCode;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            showAlert('Código copiado para a área de transferência!');
        };

        // --- CHAT RÁPIDO ---
        window.toggleChat = function() {
            const chatModal = document.getElementById('chat-modal');
            chatModal.classList.toggle('translate-y-full');
            document.getElementById('chat-unread-dot').classList.add('hidden');
        };

        window.sendChatMessage = function() {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (!msg || !currentRoomCode) return;

            push(ref(db, `rooms/${currentRoomCode}/chat`), {
                sender: myName,
                senderId: myUserId,
                text: msg,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });

            input.value = '';
        };

        function renderChatMessages(messages) {
            const container = document.getElementById('chat-messages');
            container.innerHTML = '';

            const msgKeys = Object.keys(messages);
            if (msgKeys.length === 0) {
                container.innerHTML = '<div class="text-center text-xs text-slate-500 py-4">Nenhuma mensagem ainda.</div>';
                return;
            }

            msgKeys.forEach(key => {
                const item = messages[key];
                const isMe = item.senderId === myUserId;

                const msgDiv = document.createElement('div');
                msgDiv.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} my-1`;

                msgDiv.innerHTML = `
                    <div class="max-w-[80%] rounded-2xl px-3 py-2 text-xs ${isMe ? 'bg-rose-600 text-white rounded-br-none' : 'bg-slate-800 text-slate-200 rounded-bl-none'} shadow-md">
                        <span class="font-bold opacity-75 block text-[10px] mb-0.5">${item.sender}</span>
                        ${item.text}
                    </div>
                    <span class="text-[9px] text-slate-500 px-1 mt-0.5">${item.time}</span>
                `;
                container.appendChild(msgDiv);
            });

            container.scrollTop = container.scrollHeight;
        }

        // --- ALERTAS CUSTOMIZADOS DO SISTEMA ---
        function showAlert(msg) {
            const alertBox = document.getElementById('custom-alert');
            const alertMsg = document.getElementById('custom-alert-msg');
            alertMsg.innerText = msg;
            alertBox.classList.remove('hidden');

            setTimeout(() => {
                alertBox.classList.add('hidden');
            }, 3000);
        }

        // Inicialização do Mapa quando carregar a página
        window.addEventListener('load', () => {
            initMap();
        });
    </script>
</body>
</html>
